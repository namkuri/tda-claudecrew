[package]
name = "claudecrew"
version = "0.9.1"
description = "ClaudeCrew — 누구나 쓰는 Claude 에이전트 오케스트레이션"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# lib.rs 를 라이브러리로 노출(모바일 호환 + main.rs 에서 호출)
[lib]
name = "claudecrew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
